name: FaceProbe
options:
  deploymentTarget:
    iOS: "18.6"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    GENERATE_INFOPLIST_FILE: YES
targets:
  Persona:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.persona.faceprobe
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  PersonaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Persona
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.persona.faceprobe.tests
schemes:
  FaceProbe:
    build:
      targets:
        Persona: all
        PersonaTests: [test]
    test:
      targets: [PersonaTests]
