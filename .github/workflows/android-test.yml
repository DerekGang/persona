name: Android CI
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.repository }}-${{ github.ref_name }}-android
  cancel-in-progress: true
jobs:
  offline-face:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The default also installs the legacy `tools` package, which the SDK repository no longer has.
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Only a manual main run may populate caches; PRs and other refs only restore.
          cache-read-only: true
      - name: Restore public Robolectric runtime dependencies
        id: robolectric
        uses: actions/cache/restore@v4
        with:
          # Never cache Maven settings, credentials or unrelated/private artifacts.
          path: |
            ~/.m2/repository/org/robolectric/android-all
            ~/.m2/repository/org/robolectric/android-all-instrumented
          key: ${{ runner.os }}-robolectric-v1-inline-code-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          # Another lane's entry, or one saved under an old lane name, holds the same public jars: better than a download.
          restore-keys: |
            ${{ runner.os }}-robolectric-v1-inline-code-
            ${{ runner.os }}-robolectric-v1-
      - name: Render and compare the baseline and candidate
        working-directory: android
        run: |
          git rev-parse HEAD:android
          target=android/core/designsystem/src/main/kotlin/persona/core/designsystem/PersonaFace.kt
          tokens=android/core/designsystem/src/main/kotlin/persona/core/designsystem/Tokens.kt
          shots=core/designsystem/build/offline-face-shots
          output="$RUNNER_TEMP/face-evidence"
          verify() {
            ./gradlew --no-daemon --no-watch-fs --console=plain --stacktrace --max-workers=2 \
              -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process \
              -PpersonaApplicationId=com.example.persona -PpersonaGoogleOAuthScheme=persona.oauth.unset \
              -PpersonaRepoRoot="$GITHUB_WORKSPACE" :core:designsystem:testDebugUnitTest \
              --tests persona.core.designsystem.OfflineFaceShotsTest \
              --tests persona.core.designsystem.PersonaFaceTest
          }
          # The checkout includes this workflow, the capture fixture, and the exact candidate source.
          cp "$GITHUB_WORKSPACE/$target" "$RUNNER_TEMP/PersonaFace.kt"
          cp "$GITHUB_WORKSPACE/$tokens" "$RUNNER_TEMP/Tokens.kt"
          git show HEAD~3:"$tokens" > "$GITHUB_WORKSPACE/$tokens"
          git show HEAD~3:"$target" > "$GITHUB_WORKSPACE/$target"
          verify
          mkdir -p "$output"
          mv "$shots" "$output/before"
          cp "$RUNNER_TEMP/Tokens.kt" "$GITHUB_WORKSPACE/$tokens"
          cp "$RUNNER_TEMP/PersonaFace.kt" "$GITHUB_WORKSPACE/$target"
          verify
          mv "$shots" "$output/after"
          cp -r core/designsystem/build/test-results/testDebugUnitTest "$output/results"
          python3 - "$output" <<'PYCODE'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          before = {p.name: p.read_bytes() for p in (root / 'before').glob('*.png')}
          after = {p.name: p.read_bytes() for p in (root / 'after').glob('*.png')}
          assert before.keys() == after.keys() and len(before) == 20
          changed = {name for name in before if before[name] != after[name]}
          assert changed == {'dark-32-offline.png', 'dark-64-offline.png'}, changed
          print('18 unchanged images are byte-identical; only the two dark offline captures changed.')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-offline-face-evidence
          retention-days: 7
          path: ${{ runner.temp }}/face-evidence/
