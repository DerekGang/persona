name: Verify offline to-do dispatch on Android
on:
  push:
    branches: ['verify/10675-android-*']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install the repository's Android toolchain
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
          rustup toolchain install 1.98.0 --profile minimal
          rustup target add --toolchain 1.98.0 aarch64-linux-android x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Verify the queued to-do detail
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=4 \
            :core:hub:test --tests '*HttpTasksApiTest' \
            :feature:agents:testDebugUnitTest --tests '*TodoStartRemediesShotsTest' \
            :app:compileDebugKotlin
          test -s feature/agents/build/todo-start-remedies-shots/todo-offline-start-light.png
          test -s feature/agents/build/todo-start-remedies-shots/todo-offline-start-dark.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persona-10675-android
          path: |
            android/core/domain/build/test-results/test
            android/core/hub/build/test-results/test
            android/feature/agents/build/test-results/testDebugUnitTest
            android/feature/agents/build/todo-start-remedies-shots
          if-no-files-found: warn
          retention-days: 2
