name: Persona iOS 18.6 compatibility verification
on:
  push:
    branches: ['verify/13365-full-*']
permissions:
  contents: read
jobs:
  ios18:
    runs-on: macos-15
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      CI_SPM_CACHE: ${{ github.workspace }}/.ci-cache/spm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select the compatibility toolchain and install project generation tools
        run: |
          source scripts/ci/common.sh
          ci_run 'Select system Xcode 26.3' 60 sudo xcode-select --switch "$DEVELOPER_DIR"
          ci_run 'Initialize Xcode 26.3 platform services' 900 sudo env DEVELOPER_DIR="$DEVELOPER_DIR" xcodebuild -runFirstLaunch
          brew install xcodegen
      - name: Run the repository iOS 18.6 simulator suite
        env:
          CI_APPLE_DIAGNOSTICS: ${{ runner.temp }}/persona-ios18-diagnostics
          TEST_RUNNER_PERSONA_TEST_ARTIFACTS: ${{ runner.temp }}/persona-ios18-shots
        run: |
          mkdir -p "$TEST_RUNNER_PERSONA_TEST_ARTIFACTS"
          scripts/ci/apple.sh ios18
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-ios18-compatibility-evidence
          path: |
            ${{ runner.temp }}/persona-ios18-shots
            ${{ runner.temp }}/persona-ios18-diagnostics
          if-no-files-found: warn
          retention-days: 3
