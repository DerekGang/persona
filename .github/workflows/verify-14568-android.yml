name: Verify native command input on Android
on:
  push:
    branches: ['verify/14568-android-*']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install the repository's Android toolchain
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
          rustup toolchain install 1.98.0 --profile minimal
          rustup target add --toolchain 1.98.0 aarch64-linux-android x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Run native command-input, permission and screenshot tests
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=4 :feature:chat:testDebugUnitTest \
            --tests '*CommandInputCardUiTest' --tests '*PermissionFieldsCardUiTest' --tests '*SecretRunCardUiTest' --tests '*InteractionSubmissionTest'
          ./gradlew --no-daemon --max-workers=4 :feature:agents:testDebugUnitTest --tests '*SecretRunRequestCardTest'
          ./gradlew --no-daemon --max-workers=4 :app:compileDebugKotlin
          for style in glass brief board; do
            for appearance in light dark; do
              test -s "feature/chat/build/command-input-shots/command-input-$style-$appearance.png"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persona-14568-android
          path: |
            android/feature/chat/build/test-results/testDebugUnitTest
            android/feature/chat/build/command-input-shots
          if-no-files-found: warn
          retention-days: 2
