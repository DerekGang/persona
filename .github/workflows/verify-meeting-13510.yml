name: Meeting recap dark appearance
on:
  push:
    branches: [verify/13510-meeting-xcode263]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 65
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      PERSONA_META_WEARABLES: "NO"
      PERSONA_LEAN_DEV_BUILD: "YES"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and archive the iPhone simulator app
        shell: bash
        run: |
          set -euo pipefail
          export PERSONA_CONFIG="$RUNNER_TEMP/persona-ci.json"
          printf '%s\n' '{"app":{"bundle_id":"org.example.persona.ci","team_id":""}}' > "$PERSONA_CONFIG"
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcodebuild -version
          brew install xcodegen
          native/app-core/scripts/build-apple.sh --simulator
          python3 scripts/persona_config.py xcconfig
          xcodegen generate --spec apple/project.yml --project apple
          package_cache="$RUNNER_TEMP/packages"
          xcodebuild -quiet -project apple/Persona.xcodeproj -scheme Persona -clonedSourcePackagesDirPath "$package_cache" -resolvePackageDependencies
          xcodebuild -quiet build -disableAutomaticPackageResolution -clonedSourcePackagesDirPath "$package_cache" -project apple/Persona.xcodeproj -scheme Persona -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
          ditto -c -k --keepParent "$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/Persona.app" "$RUNNER_TEMP/persona-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: persona-13510-simulator-app
          path: ${{ runner.temp }}/persona-simulator.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Open the pending meeting recap in dark mode
        shell: bash
        run: |
          set -euo pipefail
          export PERSONA_CONFIG="$RUNNER_TEMP/persona-ci.json"
          printf '%s\n' '{"app":{"bundle_id":"org.example.persona.ci","team_id":""}}' > "$PERSONA_CONFIG"
          mkdir -p "$RUNNER_TEMP/meeting-shots"
          mock_log="$RUNNER_TEMP/meeting-shots/mock.log"
          PORT=18760 MOCK_RECORDING_MINUTES=pending python3 -u scripts/mock/mock_hub.py > "$mock_log" 2>&1 &
          mock_pid=$!
          trap 'kill "$mock_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --connect-timeout 2 --fail --silent http://127.0.0.1:18760/api/v1/health; then break; fi
            if ! kill -0 "$mock_pid" 2>/dev/null; then tail -25 "$mock_log"; exit 1; fi
            sleep 2
          done
          curl --connect-timeout 2 --fail --silent --show-error http://127.0.0.1:18760/api/v1/health
          curl --fail --silent --show-error -H 'Content-Type: application/json' --data '{"mode":"pending"}' http://127.0.0.1:18760/mock/recording_minutes
          app="$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/Persona.app"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          sim=$(scripts/app/sim-boot.sh --profile stock "Persona 13510 dark")
          xcrun simctl ui "$sim" appearance dark
          xcrun simctl install "$sim" "$app"
          xcrun simctl launch "$sim" "$bundle_id" \
            -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -app.navigation separate -ui.style glass -ui.screenshotBanner NO \
            -pairURL 'persona://pair?url=http%3A%2F%2F127.0.0.1%3A18760&token=mock' \
            -tab assistant -openShellPage recordings -showMeetingSample after-pending
          cat > "$RUNNER_TEMP/verify-title.swift" <<'SWIFT'
          import Foundation
          import Vision
          
          for path in CommandLine.arguments.dropFirst() {
              let url = URL(fileURLWithPath: path)
              let request = VNRecognizeTextRequest()
              request.recognitionLanguages = ["zh-Hans", "en-US"]
              request.recognitionLevel = .accurate
              request.regionOfInterest = CGRect(x: 0.31, y: 0.86, width: 0.38, height: 0.08)
              try VNImageRequestHandler(url: url).perform([request])
              let recognized = (request.results ?? []).compactMap { $0.topCandidates(1).first?.string }
              print("\(url.lastPathComponent): \(recognized.isEmpty ? "no centered title found" : recognized.joined(separator: ", "))")
          }
          SWIFT
          for attempt in {1..12}; do
            sleep 10
            xcrun simctl io "$sim" screenshot "$RUNNER_TEMP/meeting-shots/after-dark-pending.png"
            if swift "$RUNNER_TEMP/verify-title.swift" "$RUNNER_TEMP/meeting-shots/after-dark-pending.png" | grep -F '会议'; then exit 0; fi
          done
          exit 1
      - name: Save visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meeting-13510-dark-appearance
          path: ${{ runner.temp }}/meeting-shots
          if-no-files-found: warn
          retention-days: 7
