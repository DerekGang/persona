name: Meeting recap visual smoke test
on:
  push:
    branches: [verify/13510-meeting-appearance-arm64]
permissions:
  contents: read
jobs:
  appearance:
    runs-on: xcode-27
    timeout-minutes: 70
    env:
      PERSONA_META_WEARABLES: "NO"
      PERSONA_LEAN_DEV_BUILD: "YES"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the iPhone simulator app
        shell: bash
        run: |
          set -euo pipefail
          export PERSONA_CONFIG="$RUNNER_TEMP/persona-ci.json"
          printf '%s\n' '{"app":{"bundle_id":"org.example.persona.ci","team_id":""}}' > "$PERSONA_CONFIG"
          xcodebuild -version
          brew install xcodegen
          native/app-core/scripts/build-apple.sh --simulator
          python3 scripts/persona_config.py xcconfig
          xcodegen generate --spec apple/project.yml --project apple
          xcodebuild -quiet build -project apple/Persona.xcodeproj -scheme Persona -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
          test -d "$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/Persona.app"
      - name: Capture the meeting recap in both appearances
        shell: bash
        run: |
          set -euo pipefail
          sim=$(scripts/app/sim-boot.sh --profile stock "Persona 13510 smoke")
          app="$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/Persona.app"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          mkdir -p "$RUNNER_TEMP/meeting-shots"
          for appearance in light dark; do
            mock_log="$RUNNER_TEMP/meeting-$appearance.log"
            PORT=18760 MOCK_RECORDING_MINUTES=pending python3 scripts/mock/mock_hub.py > "$mock_log" 2>&1 &
            mock_pid=$!
            trap 'kill "$mock_pid" 2>/dev/null || true' EXIT
            curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:18760/api/v1/health
            curl --fail --silent --show-error -H 'Content-Type: application/json' --data '{"mode":"pending"}' http://127.0.0.1:18760/mock/recording_minutes
            xcrun simctl ui "$sim" appearance "$appearance"
            xcrun simctl install "$sim" "$app"
            xcrun simctl launch "$sim" "$bundle_id" \
              -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -app.navigation separate -ui.style glass \
              -pairURL 'persona://pair?url=http%3A%2F%2F127.0.0.1%3A18760&token=mock' \
              -tab assistant -openShellPage recordings -showMeetingSample after-pending
            for step in {1..40}; do
              grep -q 'GET /api/v1/kb/recordings/' "$mock_log" && break
              sleep 2
            done
            grep 'GET /api/v1/kb/recordings/' "$mock_log"
            sleep 5
            xcrun simctl io "$sim" screenshot "$RUNNER_TEMP/meeting-shots/after-$appearance-pending.png"
            test -s "$RUNNER_TEMP/meeting-shots/after-$appearance-pending.png"
            xcrun simctl terminate "$sim" "$bundle_id"
            xcrun simctl uninstall "$sim" "$bundle_id"
            kill "$mock_pid"
            wait "$mock_pid" || true
            trap - EXIT
          done
      - name: Save visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meeting-13510-visual-smoke
          path: |
            ${{ runner.temp }}/meeting-shots/*.png
            ${{ runner.temp }}/meeting-*.log
          if-no-files-found: warn
          retention-days: 7
