name: Verify the Android To Decide pager
on:
  push:
    branches: ['verify/12858-android-*']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      JAVA_TOOL_OPTIONS: '-Drobolectric.dependency.repo.url=https://repo.maven.apache.org/maven2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install the repository's Android toolchain
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
          rustup toolchain install 1.98.0 --profile minimal
          rustup target add --toolchain 1.98.0 aarch64-linux-android x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Test pager state, native UI and app navigation
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=4 :feature:chat:testDebugUnitTest \
            --tests '*ToDecideTest' --tests '*ToDecideShotsTest' --tests '*PendingStackTest' --tests '*ChatMessageJumpTest'
          ./gradlew --no-daemon --max-workers=4 :app:testDebugUnitTest --tests '*AppNavigatorTest'
          ./gradlew --no-daemon --max-workers=4 :app:compileDebugKotlin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persona-12858-android
          path: |
            android/feature/chat/build/test-results/testDebugUnitTest
            android/feature/chat/build/to-decide-shots
            android/app/build/test-results/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 2
