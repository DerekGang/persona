name: Persona face renderer iOS 18.6 probe
on:
  push:
    branches: ['verify/13365-face-*']
permissions:
  contents: read
jobs:
  face:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare Xcode and project generator
        run: |
          sudo xcode-select --switch "$DEVELOPER_DIR"
          sudo env DEVELOPER_DIR="$DEVELOPER_DIR" xcodebuild -runFirstLaunch
          xcodebuild -version
          brew install xcodegen
      - name: Compare hosted renderers on iOS 18.6
        run: bash .github/face-probe/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios18-face-probe
          path: |
            ${{ runner.temp }}/persona-face-probe/shots
            ${{ runner.temp }}/persona-face-probe/face-test.log
          if-no-files-found: warn
          retention-days: 2
